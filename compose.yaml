name: policygraph

services:
  app:
    build:
      context: .
    image: policygraph:local
    ports:
      - "${POLICYGRAPH_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
