name: Bug report
description: Report incorrect behaviour, data, or evidence presentation.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not disclose vulnerabilities or secrets here; follow SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Data or provenance, Policy status, API, Interface or accessibility, Documentation, Other]
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include record IDs, URLs, and evidence locators where relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
