name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and quality dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Format and lint
        run: |
          python -m ruff format --check .
          python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test API, pipeline, and golden evaluations
        run: python -m pytest tests evals
      - name: Run release evaluation
        run: python -m evals.evaluate
      - name: Check repository links and secrets
        run: |
          python scripts/check_links.py
          python scripts/check_secrets.py
      - name: Check browser JavaScript syntax
        run: node --check app/assets/app.js
      - name: Build and inspect distributions
        run: |
          python -m build
          python scripts/verify_wheel.py

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build standalone image
        run: docker build --tag policygraph:test .
      - name: Smoke-test image
        run: |
          docker run --detach --name policygraph-test --publish 127.0.0.1:8000:8000 \
            --read-only --tmpfs /tmp:rw,size=16m --cap-drop ALL \
            --security-opt no-new-privileges policygraph:test
          trap 'docker logs policygraph-test; docker rm --force policygraph-test' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health | grep --quiet '"status":"ok"'; then
              test "$(docker exec policygraph-test id -u)" = "10001"
              curl --fail --silent http://127.0.0.1:8000/api/graph > /dev/null
              curl --fail --silent http://127.0.0.1:8000/ > /dev/null
              exit 0
            fi
            sleep 1
          done
          exit 1
